name: Bug
description: Something in the harness does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got. Paste the error or the run summary.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Android 14 emulator / iPhone 15 on iOS 18 / ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: harness, React Native, Appium, drivers, Node
  - type: textarea
    id: more
    attributes:
      label: Anything else
