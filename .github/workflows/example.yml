name: Example app on an emulator

# The harness tested against a real React Native app (example/) on an
# Android emulator: build the debug app, then run its specs with the harness
# starting Appium and Metro itself. Slow (a native build and an emulator), so
# it runs on changes to the package or the example, and by hand.

on:
  push:
    branches: [main]
    paths:
      ['packages/harness/**', 'example/**', '.github/workflows/example.yml']
  pull_request:
    paths:
      ['packages/harness/**', 'example/**', '.github/workflows/example.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: example-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build

      - name: Build the debug app
        working-directory: example/android
        run: ./gradlew app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Appium and its Android driver
        run: |
          # a pair known to work together; the driver pins the server range it accepts
          npm install -g appium@3.7.0
          appium driver install uiautomator2@8.5.2

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the example's specs
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # no windows to open, no dashboard on a runner
          E2E_WINDOWS: 'off'
          E2E_UI: 'off'
        with:
          # a private repo's runner has 2 cores: API 34 with Google APIs never
          # finished booting in 10 minutes there; the plain AOSP image of 30 does
          api-level: 30
          arch: x86_64
          target: default
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash example/e2e/ci.sh

      - name: Keep the run's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-e2e-out
          path: example/e2e/out/
          if-no-files-found: ignore
