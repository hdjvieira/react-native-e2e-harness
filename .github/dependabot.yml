version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    # a major (WebdriverIO, Mocha, @types/node past the lowest Node supported)
    # is a decision, made in an issue, not a weekly bump
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      all:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
