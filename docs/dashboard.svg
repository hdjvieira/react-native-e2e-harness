<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" role="img" aria-labelledby="title desc">
  <title id="title">How a run feeds the dashboard</title>
  <desc id="desc">A run writes plan.json, events.jsonl, results.jsonl and run.json into its folder, and current.json names the run going on. The dashboard server reads those files and answers the page, which polls every second; from the page, Run, Queue and Stop go to the server, which starts runs.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #8c959f; }
    .accent { fill: #ddf4ff; stroke: #0969da; }
    .title { font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1f2328; }
    .name { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1f2328; }
    .note { font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #59636e; }
    .line { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .dash { stroke: #0969da; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .label { font: 11px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #0969da; }
    .head { fill: #59636e; }
    .headaccent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .accent { fill: #0c2d4a; stroke: #4493f8; }
      .title, .name { fill: #e6edf3; }
      .note { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .dash { stroke: #4493f8; }
      .label { fill: #4493f8; }
      .head { fill: #9198a1; }
      .headaccent { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head" />
    </marker>
    <marker id="arrowaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="headaccent" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="200" rx="12" />
  <rect class="box" x="20" y="70" width="160" height="60" rx="6" />
  <text class="name" x="100" y="96" text-anchor="middle">wdio run</text>
  <text class="note" x="100" y="114" text-anchor="middle">yarn e2e run, or the page</text>
  <rect class="accent" x="240" y="30" width="220" height="140" rx="6" />
  <text class="name" x="350" y="60" text-anchor="middle">out/</text>
  <text class="note" x="350" y="78" text-anchor="middle">&lt;run&gt;/plan.json</text>
  <text class="note" x="350" y="96" text-anchor="middle">&lt;run&gt;/events.jsonl</text>
  <text class="note" x="350" y="114" text-anchor="middle">&lt;run&gt;/results.jsonl</text>
  <text class="note" x="350" y="132" text-anchor="middle">&lt;run&gt;/run.json</text>
  <text class="note" x="350" y="150" text-anchor="middle">current.json</text>
  <rect class="box" x="520" y="70" width="180" height="60" rx="6" />
  <text class="name" x="610" y="96" text-anchor="middle">dashboard server</text>
  <text class="note" x="610" y="114" text-anchor="middle">yarn e2e dashboard</text>
  <rect class="box" x="760" y="70" width="180" height="60" rx="6" />
  <text class="name" x="850" y="96" text-anchor="middle">the page</text>
  <text class="note" x="850" y="114" text-anchor="middle">polls every second</text>
  <path class="line" d="M180,100 L238,100" marker-end="url(#arrow)" />
  <text class="label" x="209" y="90" text-anchor="middle">writes</text>
  <path class="line" d="M460,100 L518,100" marker-end="url(#arrow)" />
  <text class="label" x="489" y="90" text-anchor="middle">reads</text>
  <path class="line" d="M700,92 L758,92" marker-end="url(#arrow)" />
  <path class="line" d="M758,112 L702,112" marker-end="url(#arrow)" />
  <text class="note" x="729" y="58" text-anchor="middle">Run, Queue, Stop</text>
  <path class="dash" d="M610,130 C610,190 100,190 100,132" marker-end="url(#arrowaccent)" />
  <text class="label" x="355" y="186" text-anchor="middle">starts runs</text>
</svg>
