<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
  <title id="title">How react-native-e2e-harness fits together</title>
  <desc id="desc">Your app holds a package.json entry, an e2e config, specs and helpers, and optional in-app switches. The harness's runner, testID helpers, dashboard and AI runbook drive the app on a device through Appium and write run folders the dashboard reads.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #8c959f; }
    .accent { fill: #ddf4ff; stroke: #0969da; }
    .title { font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1f2328; }
    .name { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1f2328; }
    .note { font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #59636e; }
    .line { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .dash { stroke: #0969da; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .label { font: 11px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #0969da; }
    .head { fill: #59636e; }
    .headaccent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .accent { fill: #0c2d4a; stroke: #4493f8; }
      .title, .name { fill: #e6edf3; }
      .note { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .dash { stroke: #4493f8; }
      .label { fill: #4493f8; }
      .head { fill: #9198a1; }
      .headaccent { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head" />
    </marker>
    <marker id="arrowaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="headaccent" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="420" rx="12" />

  <!-- your app -->
  <rect class="panel" x="20" y="24" width="260" height="372" rx="10" />
  <text class="title" x="150" y="52" text-anchor="middle">Your app</text>
  <rect class="box" x="40" y="70" width="220" height="56" rx="6" />
  <text class="name" x="150" y="93" text-anchor="middle">package.json</text>
  <text class="note" x="150" y="112" text-anchor="middle">1 devDependency, 1 "e2e" script</text>
  <rect class="box" x="40" y="142" width="220" height="56" rx="6" />
  <text class="name" x="150" y="165" text-anchor="middle">e2e/e2e.config.ts</text>
  <text class="note" x="150" y="184" text-anchor="middle">app ids, start screen, hooks</text>
  <rect class="box" x="40" y="214" width="220" height="56" rx="6" />
  <text class="name" x="150" y="237" text-anchor="middle">e2e/specs, e2e/support</text>
  <text class="note" x="150" y="256" text-anchor="middle">your tests and your helpers</text>
  <rect class="accent" x="40" y="286" width="220" height="56" rx="6" />
  <text class="name" x="150" y="309" text-anchor="middle">createE2ESwitches</text>
  <text class="note" x="150" y="328" text-anchor="middle">in the app, debug builds only</text>
  <text class="note" x="150" y="372" text-anchor="middle">+ AGENTS.md or a skill (optional)</text>

  <!-- the harness -->
  <rect class="panel" x="340" y="24" width="300" height="372" rx="10" />
  <text class="title" x="490" y="52" text-anchor="middle">react-native-e2e-harness</text>
  <rect class="box" x="360" y="70" width="260" height="56" rx="6" />
  <text class="name" x="490" y="93" text-anchor="middle">runner</text>
  <text class="note" x="490" y="112" text-anchor="middle">plan, reports, chains, watchdog, clean-ups</text>
  <rect class="box" x="360" y="142" width="260" height="56" rx="6" />
  <text class="name" x="490" y="165" text-anchor="middle">dashboard</text>
  <text class="note" x="490" y="184" text-anchor="middle">live run, history, flaky tests</text>
  <rect class="box" x="360" y="214" width="260" height="56" rx="6" />
  <text class="name" x="490" y="237" text-anchor="middle">testID helpers, restartApp</text>
  <text class="note" x="490" y="256" text-anchor="middle">device CLI, slow network</text>
  <rect class="box" x="360" y="286" width="260" height="56" rx="6" />
  <text class="name" x="490" y="309" text-anchor="middle">AI runbook</text>
  <text class="note" x="490" y="328" text-anchor="middle">Claude, AGENTS.md, Cursor, Copilot</text>

  <!-- outside -->
  <rect class="box" x="700" y="70" width="110" height="56" rx="6" />
  <text class="name" x="755" y="93" text-anchor="middle">out/&lt;run&gt;</text>
  <text class="note" x="755" y="112" text-anchor="middle">summary, JUnit</text>
  <rect class="box" x="700" y="214" width="110" height="56" rx="6" />
  <text class="name" x="755" y="247" text-anchor="middle">Appium</text>
  <rect class="box" x="840" y="200" width="100" height="84" rx="10" />
  <text class="name" x="890" y="232" text-anchor="middle">Android</text>
  <text class="note" x="890" y="250" text-anchor="middle">or</text>
  <text class="name" x="890" y="268" text-anchor="middle">iOS</text>

  <!-- arrows -->
  <path class="line" d="M260,170 C300,170 310,98 358,98" marker-end="url(#arrow)" />
  <path class="line" d="M260,242 L358,242" marker-end="url(#arrow)" />
  <path class="line" d="M620,98 L698,98" marker-end="url(#arrow)" />
  <path class="line" d="M755,126 C755,170 680,170 622,170" marker-end="url(#arrow)" />
  <path class="line" d="M620,242 L698,242" marker-end="url(#arrow)" />
  <path class="line" d="M810,242 L838,242" marker-end="url(#arrow)" />
  <path class="dash" d="M360,262 C320,268 300,306 262,312" marker-end="url(#arrowaccent)" />
  <text class="label" x="310" y="320" text-anchor="middle">dev link</text>
  <path class="dash" d="M360,326 C320,330 300,364 262,368" marker-end="url(#arrowaccent)" />
  <text class="label" x="310" y="392" text-anchor="middle">writes</text>
</svg>
