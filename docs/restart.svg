<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" role="img" aria-labelledby="title desc">
  <title id="title">restartApp</title>
  <desc id="desc">restartApp asks whether this is a debug build with the app in front and a dev link set. Yes: the dev link reloads the JS in about two seconds. No: the app is killed and launched cold. Either way it walks through onboarding, closes overlays, answers permission prompts and ends on home.ready.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #8c959f; }
    .accent { fill: #ddf4ff; stroke: #0969da; }
    .title { font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1f2328; }
    .name { font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1f2328; }
    .note { font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #59636e; }
    .line { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .dash { stroke: #0969da; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .label { font: 11px system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #0969da; }
    .head { fill: #59636e; }
    .headaccent { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .accent { fill: #0c2d4a; stroke: #4493f8; }
      .title, .name { fill: #e6edf3; }
      .note { fill: #9198a1; }
      .line { stroke: #9198a1; }
      .dash { stroke: #4493f8; }
      .label { fill: #4493f8; }
      .head { fill: #9198a1; }
      .headaccent { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head" />
    </marker>
    <marker id="arrowaccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="headaccent" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="210" rx="12" />
  <rect class="box" x="20" y="82" width="130" height="46" rx="6" />
  <text class="name" x="85" y="110" text-anchor="middle">restartApp()</text>
  <rect class="box" x="190" y="60" width="210" height="90" rx="6" />
  <text class="name" x="295" y="92" text-anchor="middle">debug build,</text>
  <text class="note" x="295" y="110" text-anchor="middle">app in front,</text>
  <text class="note" x="295" y="128" text-anchor="middle">dev link set?</text>
  <rect class="accent" x="450" y="24" width="210" height="60" rx="6" />
  <text class="name" x="555" y="50" text-anchor="middle">JS reload, ~2 s</text>
  <text class="note" x="555" y="68" text-anchor="middle">myapp://e2e?reload=&lt;id&gt;</text>
  <rect class="box" x="450" y="126" width="210" height="60" rx="6" />
  <text class="name" x="555" y="152" text-anchor="middle">cold start</text>
  <text class="note" x="555" y="170" text-anchor="middle">kill and launch the app</text>
  <rect class="box" x="700" y="60" width="140" height="90" rx="6" />
  <text class="name" x="770" y="83" text-anchor="middle">on the way</text>
  <text class="note" x="770" y="101" text-anchor="middle">home.through</text>
  <text class="note" x="770" y="119" text-anchor="middle">home.overlays</text>
  <text class="note" x="770" y="137" text-anchor="middle">permission prompts</text>
  <rect class="accent" x="870" y="82" width="70" height="46" rx="6" />
  <text class="name" x="905" y="110" text-anchor="middle">ready</text>
  <path class="line" d="M150,105 L188,105" marker-end="url(#arrow)" />
  <path class="line" d="M400,90 C425,90 425,54 448,54" marker-end="url(#arrow)" />
  <path class="line" d="M400,120 C425,120 425,156 448,156" marker-end="url(#arrow)" />
  <text class="label" x="418" y="46" text-anchor="middle">yes</text>
  <text class="note" x="418" y="172" text-anchor="middle">no</text>
  <path class="line" d="M660,54 C680,54 680,90 698,90" marker-end="url(#arrow)" />
  <path class="line" d="M660,156 C680,156 680,120 698,120" marker-end="url(#arrow)" />
  <path class="line" d="M840,105 L868,105" marker-end="url(#arrow)" />
</svg>
